name: Foundation CI

on:
  pull_request:
  push:
    branches: [main, "phase-1/**"]

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck, build, and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The lockfile is not committed yet; switch to frozen installs after it is generated.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @kids-chess-academy/web typecheck
      - run: pnpm --filter @kids-chess-academy/web build
      - run: pnpm --filter @kids-chess-academy/web test

  api:
    name: API typecheck, build, and health tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The lockfile is not committed yet; switch to frozen installs after it is generated.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @kids-chess-academy/api typecheck
      - run: pnpm --filter @kids-chess-academy/api build
      - run: pnpm --filter @kids-chess-academy/api test
